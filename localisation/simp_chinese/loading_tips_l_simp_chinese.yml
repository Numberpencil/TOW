l_simp_chinese:
 LOADING_TIP_0: "认为一个民族只要拿着武器进入另一个民族，就能够让他们拥抱自己的法律和宪法，这是一个政治家能想到的最夸张的念头。没有人喜欢武装的传教士；天性和谨慎的首要忠告就是把他们当作敌人赶走。\n- 马克西米连·罗伯斯庇尔 1792年1月2日"
 LOADING_TIP_1: "全世界无产者，联合起来！\n- 卡尔·马克思，弗里德里希·恩格斯 1847年"
 LOADING_TIP_2: "批判的武器当然不能代替武器的批判，物质力量只能用物质力量来摧毁；但是理论一经掌握群众，也会变成物质力量。理论只要说服人，就能掌握群众；而理论只要彻底，就能说服人。所谓彻底，就是抓住事物的根本。但是，人的根本就是人本身。\n- 卡尔·马克思"
 LOADING_TIP_3: "政治经济学家说：劳动是一切财富的源泉。其实劳动和自然界一起才是一切财富的源泉，自然界为劳动提供材料，劳动把材料变为财富。但是劳动还远不止如此。它是整个人类生活的第一个基本条件，而且达到这样的程度，以致我们在某种意义上不得不说：劳动创造了人本身。\n- 弗里德里希·恩格斯"
 LOADING_TIP_4: "不怕承认自己的错误，不怕一次又一次地改正这些错误，这样，我们就会登上山顶。\n- 弗拉基米尔·列宁"
 LOADING_TIP_5: "政治是不流血的战争，战争是流血的政治。\n- 毛泽东"
 LOADING_TIP_6: "一个人无论学什么或作什么，只要有热情，有恒心，不要那种无着落的与人民利益不相符合的个人主义的虚荣心，总是会有进步的。\n- 毛泽东"
 LOADING_TIP_7: "当着天空中出现乌云的时候，我们就指出：这不过是暂时的现象，黑暗即将过去，曙光即在前头。\n- 毛泽东"
 LOADING_TIP_8: "根本方针是争取群众，组织群众的游击队。在这个总方针下，实行有条件的集中作战。\n- 毛泽东"
 LOADING_TIP_9: "群众是真正的英雄，而我们自己则往往是幼稚可笑的，不了解这一点，就不能得到起码的知识。\n- 毛泽东"
 LOADING_TIP_10: "为群众服务，这就是处处要想到群众，为群众打算，把群众的利益放在第一位。……这是我们与国民党的根本区别，也是共产党员革命的出发点和归宿。\n- 毛泽东"
 LOADING_TIP_11: "武器是战争的重要因素，但不是决定因素，决定的因素是人不是物。\n- 毛泽东"
 LOADING_TIP_12: "最后胜负要在持久战中去解决。\n- 毛泽东"
 LOADING_TIP_13: "我们的工作首先是战争，其次是生产，其次是文化。没有文化的军队是愚蠢的军队，而愚蠢的军队是不能战胜敌人的。\n- 毛泽东"
 LOADING_TIP_14: "永远向前，绝不后退\n- 埃里希·昂纳克"
 LOADING_TIP_15: "他们口里的宪政，不过是“挂羊头卖狗肉”。他们是在挂宪政的羊头，卖一党专政的狗肉。我并不是随便骂他们，我的话是有根据的，这根据就在于他们一面谈宪政，一面却不给人民以丝毫的自由。\n- 毛泽东"
 LOADING_TIP_16: "“没有调查就没有发言权”，这句话，虽然曾经被人讥为“狭隘经验论”的，我却至今不悔；不但不悔，我仍然坚持没有调查是不可能有发言权的。\n- 毛泽东"
 LOADING_TIP_17: "你什么都不是，你的民族才是一切！\n- 阿道夫·希特勒"
 LOADING_TIP_18: "我相信群众的革命意识最终会将革命之火带回。\n- 瓦列里·萨布林"
 LOADING_TIP_19: "你的名字将永远留在石头上！\n- 《伊兹密尔进行曲》 "
 LOADING_TIP_20: "几十年的欺骗与残暴如今已经走到尽头。萨达姆·侯赛因及其儿子必须在48小时内离开伊拉克。若他们拒绝，将面临军事冲突——由我们决定何时开始。\n- 乔治·W·布什"
 LOADING_TIP_21: "我们应该注意自己不用语言去伤害别的同志，但是，当别人用语言来伤害自己的时候，也应该受得起。\n- 刘少奇"
 LOADING_TIP_22: "个人造成历史，历史做成个人。个人造成社会，社会造成个人。\n- 胡适 "
 LOADING_TIP_23: "神的行事，有程序与时候的，祈祷是下在地里的一粒种子，还须用信心的力量去栽培他，才能生长。\n- 蒋介石"
 LOADING_TIP_24: "若日本真愿意要求和平，提出了可接受条件，则中国亦可从事停战。\n- 汪精卫"
 LOADING_TIP_25: "现在并不是结束，结束甚至还没有开始。但是现在可能是序幕的结束。\n- 温斯顿·丘吉尔"
 LOADING_TIP_26: "青年是我们的未来，是我们的希望。\n- 约瑟夫·斯大林"
 LOADING_TIP_27: "同志们，你们要知道，在你们向共产主义胜利进军的高举的旗帜上，也洒有我的一滴鲜血。\n- 布哈林 被军政府公开审判时的最后一句话"
 LOADING_TIP_28: "光有自我批评还不行，还要深入群众。只有深入群众，才能知道自己的意见对不对。\n- 周恩来 "
 LOADING_TIP_29: "我们要去创造个新鲜的太阳，不能再在这壁龛之中做甚神像！\n- 郭沫若《女神之再生》"
 LOADING_TIP_30: "我是一条天狗呀！我把月来吞了，我把日来吞了，我把一切的星球来吞了，我把全宇宙来吞了。我便是我了！\n- 郭沫若《天狗》"
 LOADING_TIP_31: "事关人类尊严，我们绝不妥协。\n- 安格拉·默克尔"
 LOADING_TIP_32: "众所周知，没有身体和心灵，国民就无法生存。但是，如果美国的精神消亡，即使国家的身心束缚于一个外星世界而生存，我们所知的美国将会消亡。\n - 富兰克林·罗斯福"
 LOADING_TIP_33: "那些剥夺他人自由的人，他们自己不配享有自由；并且，在一个公正的上帝之下，也不能长久保留它。\n- 亚伯拉罕·林肯"
 LOADING_TIP_34: "法西斯是一个宗教，二十世纪的历史将是法西斯的世纪。\n- 墨索里尼"
 LOADING_TIP_35: "热爱祖国，这是一种最纯洁、最敏锐、最高尚、最强烈、最温柔、最有情、最温存、最严酷的感情。一个真正热爱祖国的人，在各个方面都是一个真正的人。\n-苏霍姆林斯基"
 LOADING_TIP_36: "什么共产主义，这都是哄哄老百姓的空话。\n- 勃列日涅夫私下对他弟弟"
 LOADING_TIP_37: "黑暗笼罩着整个世界，但理想却光芒四射，无比灿烂。\n- 维克多·雨果"
 LOADING_TIP_38: "丑就在美的旁边，畸形靠近着优美，丑怪藏在崇高的背后，恶与善并存，黑暗与光明相共。\n- 维克多·雨果"
 LOADING_TIP_39: "这是最好的时代，也是最坏的时代。\n- 查尔斯·狄更斯《双城记》"
 LOADING_TIP_40: "老兵不死，只是凋零。\n- 道格拉斯·麦克阿瑟"
 LOADING_TIP_41: "不要问国家可以为你做什么，你应该要问自己可以为国家做什么。\n- 约翰·肯尼迪"
 LOADING_TIP_42: "那些让和平革命成为不可能的人将使得暴力革命不可避免。\n- 约翰·肯尼迪"
 LOADING_TIP_43: "让暴风雨来得更猛烈些吧！\n- 马克西姆·高尔基《海燕》"
 LOADING_TIP_44: "马列主义将开启通往革命的光辉道路。\n- 何塞·卡洛斯·马里亚特吉·拉希拉"
 LOADING_TIP_45: "我来过，我又来到，我还将重临！\n- 罗莎·卢森堡 《柏林秩序井然》"
 LOADING_TIP_46: "无论哪个时代，青年的特点总是怀抱着各种理想和幻想，这并不是什么毛病，而是一种宝贵的品质。\n- 米哈伊尔·加里宁"


 LOADING_TIP_47: "认为一个民族只要拿着武器进入另一个民族，就能够让他们拥抱自己的法律和宪法，这是一个政治家能想到的最夸张的念头。没有人喜欢武装的传教士；天性和谨慎的首要忠告就是把他们当作敌人赶走。\n——马克西米连·罗伯斯庇尔 1792年1月2日"
 LOADING_TIP_48: "平等!天赋的第一愿望，人的根本需要，一切合法的集体组合的主要纽带!\n——巴贝夫"
 LOADING_TIP_49: "土地不再归私人所有，土地不属于任何人。 我们主张，我们要求共同享受土地的果实：这些果实是属于全体的。\n——巴贝夫"
