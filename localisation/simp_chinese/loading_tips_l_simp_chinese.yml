 LOADING_TIP_98: "不要问国家可以为你做什么，你应该要问自己可以为国家做什么。\n——约翰·肯尼迪 1961年1月20日的讲话"
 LOADING_TIP_99: "那些让和平革命成为不可能的人将使得暴力革命不可避免。\n——约翰·肯尼迪"
 LOADING_TIP_100: "让暴风雨来得更猛烈些吧！\n——马克西姆·高尔基《海燕》"
 LOADING_TIP_101: "马列主义将开启通往革命的光辉道路。\n——何塞·卡洛斯·马里亚特吉·拉希拉"
 LOADING_TIP_102: "“我来过，我又来到，我还将重临！”\n——罗莎·卢森堡 《柏林秩序井然》"
 LOADING_TIP_103: "无论哪个时代，青年的特点总是怀抱着各种理想和幻想，这并不是什么毛病，而是一种宝贵的品质。\n——米哈伊尔·加里宁"
 LOADING_TIP_104: "习惯于绝望比绝望本身还要糟糕。\n——阿尔贝·加缪《鼠疫》"
 LOADING_TIP_105: "为所爱而生，为所爱而死。\n——阿尔贝·加缪 《鼠疫》"
 LOADING_TIP_106: "飞鸟奋力欲破壳而出，蛋即世界，欲新生者必先摧毁世界。\n——赫尔曼·黑塞"
 LOADING_TIP_107: "和平！和平！这个始终似在远处鸣响的铃声，我只能认为它是一种耳鸣。\n——三岛由纪夫"
 LOADING_TIP_108: "我感到兴趣的是：为所爱而生，为所爱而死。\n——阿尔贝·加缪《鼠疫》"
 LOADING_TIP_109: "只有这种人民战争，才能战胜民族敌人。国民党之所以失败，就是因为它拚命地反对人民战争。\n——毛泽东《论联合政府》"
 LOADING_TIP_110: "总之，一切为着前线，一切为着打倒日本侵略者和解放中国人民，这就是中国解放区全体军民的总口号、总方针。\n——毛泽东《论联合政府》"
 LOADING_TIP_111: "成千成万的先烈，为着人民的利益，在我们的前头英勇地牺牲了，让我们高举起他们的旗帜，踏着他们的血迹前进吧！一个新民主主义的中国不久就要诞生了，让我们迎接这个伟大的日子吧！\n——毛泽东《论联合政府》
 LOADING_TIP_112: "没有被听见不是沉默的理由。\n——维克多·雨果"
 LOADING_TIP_113: "信我的人，虽然死了，也必复活。凡活着信我的人，必永远不死。\n——约翰福音"
 LOADING_TIP_114: "历史在矛盾中前进。\n——尼古拉·布哈林"
 LOADING_TIP_115: "事实是，在同等条件下，大规模的战役和整场战争都是胜利意志强烈、目标明确、道德高尚、忠于战斗旗帜的军队，这是不争的事实。\n——格奥尔基·朱可夫"
 LOADING_TIP_116: "读毛主席的书，听毛主席的话，照毛主席的指示办事。\n——林彪"
 LOADING_TIP_117: "在需要牺牲的时候，要勇于牺牲包括牺牲自己在内。\n——林彪"
 LOADING_TIP_118: "此去泉台招旧部，旌旗十万斩阎罗。\n——陈毅"
 LOADING_TIP_119: "取义成仁今日事，人间遍种自由花。\n——陈毅"
 LOADING_TIP_120: "德国人先进攻我们就防御，如果冬天到了他们还不进攻，那我们就先发制人，撕碎他们！\n——格奥尔基·朱可夫"
 LOADING_TIP_121: "于我而言，为祖国而战、为人民献身，是我愿意奉献一生的事业。毫不客气地说，我相信自己已经为此尽到一切义务。\n——格奥尔基·朱可夫"
 LOADING_TIP_122: "为了民族，为了国家，为了同胞，为了子孙，我们只有抗战到底。\n——朱德"
 LOADING_TIP_123: "如果革命爆发，只有上帝才知道它会何时结束。我认为宪政只会让俄罗斯走向灭亡。我们需要一位专制者！\n——米哈伊尔·图哈切夫斯基 1917年"
 LOADING_TIP_124: "德军是一台机器，而机器可以被摧毁！\n——康斯坦丁·罗科索夫斯基"
 LOADING_TIP_125: "对入侵之敌的仇恨是最神圣、最符合人性的感情。而这种感情生来如此令人心痛、折磨灵魂，致使上帝禁止任何人再次体验这种感情。\n——帕维尔·巴托夫"
 LOADING_TIP_126: "在德国人的集中营里，被夺走了许多东西。肌肉…脂肪…牙齿，但从没被夺去过我的信念。我是军人，我还能履行我的职责。\n——德米特里·卡尔贝舍夫"
 LOADING_TIP_127: "目前应着重努力恢复与发展生产，改善人民生活……以艰苦的努力和实事求是的精神，开发与建设西北。\n——彭德怀 于延安机场的应邀讲话"
 LOADING_TIP_128: "去他的吧！这是来自我们的士兵的审判！\n——亚历山大·华西列夫斯基"
 LOADING_TIP_129: "我应该为所有死去的人、曾经受苦的人写一首安魂曲。我应该叙述那可怖的杀人机器，表示出我对它的抗议。\n——德米特里·肖斯塔科维奇"
 LOADING_TIP_130: "依靠广大群众还是依靠少数人，实际是个路线问题。\n——王洪文"
 LOADING_TIP_131: "一个真正的共产党员，就要出以公心，不怕撤职，不怕开除党籍，不怕坐牢，不怕杀头，不怕离婚，敢于反潮流。\n——王洪文"
 LOADING_TIP_132: "资产阶级法权是资本主义的产物，在社会主义制度下还不可避免地存在。因为资本主义不可能孕育着社会主义因素，社会主义是在资本主义的废墟上建立起来的。\n——王洪文"
 LOADING_TIP_133: "总有些来自家乡的事物伴随我们一生，使人欢喜使人愁，我们终有一日会明白那是什么，那便是我们的家乡。\n——瓦西里·舒克申"
 LOADING_TIP_134: "神圣的工作在每个人的日常事务里，理想的前途在于一点一滴做起。\n——谢觉哉"
 LOADING_TIP_135: "青年是革命的柱石。青年是革命果实的保卫者，是使历史加速向更美好的世界前进的力量。\n——宋庆龄"
 LOADING_TIP_136: "这是一个最伟大的时期——是中国人民革命斗争的里程碑。我们解脱了帝国主义和殖民统治的束缚。我们铲除了封建制度。人民正走向新的、更光辉的高峰。敬礼！中国人民革命斗争胜利万岁！\n——宋庆龄"
 LOADING_TIP_137: "我们只愿在真理的圣坛之前低头，不愿在一切物质的权威之前拜倒。\n——郭沫若"
 LOADING_TIP_138: "不管白猫、黑猫，会捉老鼠就是好猫。\n——邓小平"
 LOADING_TIP_139: "宜举国一家，子孙相传，确信神州不灭，念任重道远，倾总力建设将来，誓笃道义、巩志操，发扬国体精华，以期无后世界之进运。尔臣民，其克体朕意。\n——昭和天皇"
 LOADING_TIP_140: "而尚继续交战，终招来我民族之灭亡，人类文明之所延亦破却；如斯，朕何以保亿兆赤子、谢皇祖皇宗之神灵？是朕之帝国政府所以应共同宣言之至也。\n——昭和天皇"
 LOADING_TIP_141: "使日本天赋之类，传遍八纮一宇！\n——日本陆军口号"
 LOADING_TIP_142: "法国已在一场战役中缺席了，但法国并不会在这场战争中缺席。\n——夏尔·戴高乐"
 LOADING_TIP_143: "你该如何统治一个拥有二百四十六种乳酪的国家？\n——夏尔·戴高乐"
 LOADING_TIP_144: "但是难道败局已定，胜利已经无望？不，不能这样说！\n——夏尔·戴高乐"
 LOADING_TIP_145: "为自由平等而战，为文明进步而斗争\n——幸德秋水《祭自由党文》"
 LOADING_TIP_146: "民主的共同战线是世界的潮流，历史的潮流。\n——野坂参三
 LOADING_TIP_147: "今天要隔离、明天要隔离、永远要隔离！\n——乔治·华莱士"
 LOADING_TIP_148: "这个世界确实充满苦难，哀伤，无知与暴力，但千万不要以为个人对此无能为力，并因此而感到沮丧，虽然很少有人伟大到足以改变历史的方向，但我们每个人都能努力改变历史的某小部分，而这些小动作最后的总合，就会写进这一带的历史中。\n——罗伯特·肯尼迪"
 LOADING_TIP_149: "美国需要的不是分裂；美国需要的不是仇恨；美国需要的不是暴力或无法无天，而是对彼此的爱、智慧和同情，以及对那些仍在此地受苦受难的人抱持的正义感，不管他们是白人还是黑人。\n——罗伯特·肯尼迪 于马丁·路德·金遇刺后"
 LOADING_TIP_150: "历史将宣判我无罪！\n——菲德尔·卡斯特罗"
 LOADING_TIP_151: "对于古巴革命者来说，反对帝国主义的战场包括全世界。\n——菲德尔·卡斯特罗"
 LOADING_TIP_152: "我们并不是要教会我们的人民去相信，而是要教会他们去思考。\n——菲德尔·卡斯特罗"
 LOADING_TIP_153: "我们不会相信一个选票选出的政府，西班牙国民从未通过选票箱自由表达过自己的意志，西班牙没有那些愚蠢的愿望。\n—— 弗朗西斯科·佛朗哥 1938年"